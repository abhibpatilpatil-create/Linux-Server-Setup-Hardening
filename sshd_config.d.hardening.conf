# === SSH Hardening Drop-in ===
# Applied by: scripts/01-initial-setup.sh
# Review before restarting sshd: systemctl restart sshd

# Do not allow root to log in directly
PermitRootLogin no

# Disable password-based authentication (key-only auth)
PasswordAuthentication no
ChallengeResponseAuthentication no

# Disable empty passwords
PermitEmptyPasswords no

# Idle timeout in seconds (user disconnect after 5 min idle)
IdleTimeout 300

# Log level for security auditing
LogLevel VERBOSE

# Max authentication attempts
MaxAuthTries 3

# Max Sessions
MaxSessions 2

# Print last log
PrintLastLog yes

# Print motd
PrintMotd no